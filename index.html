<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ardoise — séances de hockey</title>
    <meta
      name="description"
      content="L'ardoise du coach de hockey : dessiner des exercices sur la patinoire, les ranger, composer et imprimer ses séances. 100 % local, aucune donnée transmise."
    />
    <link rel="stylesheet" href="css/ardoise.css" />

    <!-- Le thème choisi doit être posé AVANT le premier rendu, sinon la
         page clignote dans le thème du système avant de basculer. Seule
         duplication assumée de la clé de stockage (voir js/core/theme.js). -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("ardoise_v1_theme"));
        if (t === "sombre" || t === "clair")
          document.documentElement.setAttribute("data-theme", t === "sombre" ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="barre">
      <a class="titre" href="#/seances">Ardoise</a>
      <nav class="modes" id="modes" aria-label="Écrans">
        <a href="#/seances" data-ecran="seances">Séances</a>
        <a href="#/exercices" data-ecran="exercices">Bibliothèque</a>
        <a href="#/groupes" data-ecran="groupes">Groupes</a>
      </nav>
      <span class="spacer"></span>

      <!-- On atteint une chose en disant son nom. C'était le manque net
           de l'appli : un seul champ de recherche, qui ne cherchait que
           des exercices, et seulement depuis deux écrans. -->
      <button id="act-recherche" class="cherche" type="button" title="Chercher un exercice, une séance, un groupe">
        <span>Chercher…</span><kbd>⌘K</kbd>
      </button>

      <!-- Exporter, Importer, Catalogue, Vider et le thème occupaient la
           barre sur tous les écrans, y compris au bord de la glace, où
           « Vider » se trouvait sous le pouce d'un coach ganté. Ils
           tiennent dans un menu : on les cherche une fois par saison. -->
      <button id="etat-synchro" class="synchro" type="button" hidden></button>
      <details class="menu menu-systeme" id="menu-systeme">
        <summary class="bouton" aria-label="Réglages" title="Réglages"><span id="act-compte" hidden></span>⋯</summary>
        <div class="menu-liste">
          <button id="entree-compte" type="button">Se connecter…</button>
          <hr />
          <button id="act-exporter" type="button" title="Télécharger toutes vos données en un fichier JSON">Exporter mes données</button>
          <button id="act-importer" type="button" title="Recharger un fichier exporté">Importer un fichier…</button>
          <button id="act-catalogue" type="button" title="Réinstaller les exercices fournis avec l'appli (sans toucher aux vôtres)">Réinstaller le catalogue</button>
          <hr />
          <button id="act-theme" class="theme" type="button" title="Thème d'affichage"></button>
          <hr />
          <button id="act-vider" class="danger" type="button" title="Tout effacer de ce navigateur">Tout effacer…</button>
        </div>
      </details>
      <input id="fichier-archive" type="file" accept="application/json,.json" hidden />
    </header>

    <p id="statut" role="status" hidden></p>

    <main id="main"></main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
